setup_push_notifications:
  name: Set up push notifications [Internal]
  description: >-
    Store the JWT token used to authenticate with the Zendo push notification
    backend. This is typically called by the Zendo mobile app during setup. 
    This is an internal service and should not be called manually.
  fields:
    token:
      name: Token
      description: The JWT token for push notifications.
      required: true
      example: "eyJhbGciOiJIUzI1NiIs..."
      selector:
        text:

refresh_profiles:
  name: Refresh people and device groups
  description: >-
    Fetch the people and device groups from the Zendo backend and create their
    entities: a notification entity for each person, and an event entity for
    each device group.

send_notification:
  name: Send notification
  description: >-
    Send a push notification to one or more Zendo people. Device groups can't
    receive push notifications.
  target:
    entity:
      domain: notify
      integration: zendo
  fields:
    message:
      name: Message
      description: The notification message.
      required: true
      selector:
        text:
    interruption_level:
      name: Interruption level
      description: >-
        Optional. Set to "time_sensitive" for time-sensitive notifications or
        "critical" for critical alerts that bypass Do Not Disturb.
      required: false
      selector:
        select:
          options:
            - label: "Time sensitive"
              value: "time_sensitive"
            - label: "Critical"
              value: "critical"
    deep_link_destination:
      name: Deep link destination
      description: >-
        Optional. The ID of a deep link destination. Tapping the notification
        opens the corresponding view in the Zendo app. Use the
        list_deep_link_destinations service to see available IDs.
      required: false
      selector:
        text:

set_deep_link_destinations:
  name: Set deep link destinations [Internal]
  description: >-
    Store the list of deep link destinations from the Zendo mobile app. This is
    an internal service and should not be called manually.
  fields:
    destinations:
      name: Destinations
      description: JSON-encoded array of deep link destinations.
      required: true
      selector:
        text:

list_deep_link_destinations:
  name: List deep link destinations
  description: >-
    List stored deep link destinations for use in automations.

notify_site_config_manifest_update:
  name: Notify site config manifest updated [Internal]
  description: >-
    Broadcast a site config manifest update event to connected clients.
  fields:
    payload:
      name: Payload
      description: JSON string containing the site config manifest update metadata.
      required: true
      selector:
        text:

ring_doorbell:
  name: Ring doorbell
  description: >-
    Ring Zendo like a doorbell for the people and device groups you target:
    shows an in-app alert and plays a ringtone. Only rings on their devices that
    have the Zendo app open in kiosk mode.
  target:
    entity:
      - domain: notify
        integration: zendo
      - domain: event
        integration: zendo
  fields:
    deep_link_destination:
      name: Camera/Doorbell
      description: >-
        Required. The ID of a security camera deep link destination. The alert
        shows this camera's snapshot and Answer opens its stream. Use the
        list_deep_link_destinations service to see available IDs. Only security
        camera/doorbell destinations are allowed.
      required: true
      selector:
        text:
    sound:
      name: Ringtone
      description: >-
        Optional. The ringtone to play. Omit for a silent (visual-only) alert.
      required: false
      selector:
        select:
          custom_value: true
          options:
            - label: "Bells"
              value: "bells"
            - label: "Ding Dong"
              value: "ding-dong"
            - label: "Ding Dong 2"
              value: "ding-dong-2"
            - label: "Ding Dong 3"
              value: "ding-dong-3"
            - label: "Meditation Bell"
              value: "meditation-bell"
            - label: "Ring"
              value: "ring"
            - label: "Subtle"
              value: "subtle"
            - label: "Subtle 2"
              value: "subtle-2"
            - label: "Subtle 3"
              value: "subtle-3"
    volume:
      name: Volume
      description: >-
        Optional. Device output volume (0-100) to set while ringing. Omit to
        ring at the device's current volume.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"
    repeat:
      name: Repeat
      description: >-
        Optional. How many times to play the ringtone (1-5). Defaults to 1.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 5
          mode: box

doorbell_action:
  name: Doorbell action [Internal]
  description: >-
    Broadcast a doorbell action to connected Zendo apps. This is an internal
    service and should not be called manually.
  fields:
    event_id:
      name: Event ID
      description: >-
        The ring's event ID.
      required: true
      selector:
        text:
    action:
      name: Action
      description: >-
        Optional. The action that occurred.
      required: false
      selector:
        text:

# ---------------------------------------------------------------------------
# Managed devices -- device-facing (called by the Zendo app)
# ---------------------------------------------------------------------------

register_managed_device:
  name: Register managed device [Internal]
  description: >-
    Register a managed Zendo device and respond with its managed device ID.
    Creates or updates the device in the Home Assistant device registry and its
    sensor entities. This is an internal service called by the Zendo app and
    should not be called manually.
  fields:
    profile_id:
      name: Profile ID
      description: Required. The profile ID that owns this device.
      required: true
      selector:
        text:
    device_id:
      name: Device ID
      description: Required. The unique device identifier.
      required: true
      selector:
        text:
    device_name:
      name: Device name
      description: Required. The user-facing device name (e.g. "Kitchen").
      required: true
      selector:
        text:
    device_brand:
      name: Device brand
      description: >-
        Required. The device manufacturer brand (e.g. "Apple"). Can be null.
      required: true
      selector:
        text:
    device_type:
      name: Device type
      description: Required. The device type (e.g. "tablet", "phone").
      required: true
      selector:
        text:
    device_model_name:
      name: Device model name
      description: >-
        Required. The device model name (e.g. "iPad Pro"). Can be null.
      required: true
      selector:
        text:
    device_model_slug:
      name: Device model slug
      description: >-
        Optional. The ID of the device's model in the Zendo app's wall panel
        catalogue. Only a wall panel has one. Can be null.
      required: false
      selector:
        text:
    device_os:
      name: Device OS
      description: Required. The device operating system (e.g. "ios", "android").
      required: true
      selector:
        text:
    device_os_version:
      name: Device OS version
      description: >-
        Optional. The version of the device operating system (e.g. "18.5").
        Can be null.
      required: false
      selector:
        text:
    app_version:
      name: App version
      description: Required. The Zendo app version running on the device.
      required: true
      selector:
        text:
    managed_device_id:
      name: Managed device ID
      description: >-
        Optional. The managed device ID to use if no managed device is attached
        to this device yet and the ID is free. Otherwise it's ignored.
      required: false
      selector:
        text:

unregister_managed_device:
  name: Unregister managed device [Internal]
  description: >-
    Mark a managed device as unavailable. The device and its entities remain in
    Home Assistant but show as unavailable. Responds with whether a managed
    device is attached to this device. This is an internal service called by
    the Zendo app and should not be called manually.
  fields:
    profile_id:
      name: Profile ID
      description: Required. The profile ID that owns this device.
      required: true
      selector:
        text:
    device_id:
      name: Device ID
      description: Required. The unique device identifier.
      required: true
      selector:
        text:

managed_device_command_response:
  name: Managed device command response [Internal]
  description: >-
    Deliver a JSON-RPC response from a managed device back to the integration.
    This is an internal service called by the Zendo app and should not be
    called manually.
  fields:
    profile_id:
      name: Profile ID
      description: Required. The profile ID that owns the responding device.
      required: true
      selector:
        text:
    device_id:
      name: Device ID
      description: Required. The unique device identifier.
      required: true
      selector:
        text:
    response:
      name: Response
      description: >-
        Required. JSON-stringified JSON-RPC 2.0 response object, including
        the "id" field that correlates with the original command.
      required: true
      selector:
        text:

update_managed_device_state:
  name: Update managed device state [Internal]
  description: >-
    Push a state update from a managed device. Updates the device's sensor
    entities and resets its online timer. Responds with whether a managed
    device is attached to this device. This is an internal service called by
    the Zendo app and should not be called manually.
  fields:
    profile_id:
      name: Profile ID
      description: Required. The profile ID that owns this device.
      required: true
      selector:
        text:
    device_id:
      name: Device ID
      description: Required. The unique device identifier.
      required: true
      selector:
        text:
    state:
      name: State
      description: >-
        Required. JSON-stringified device state object.
      required: true
      selector:
        text:

list_managed_devices:
  name: List managed devices [Internal]
  description: >-
    List the managed devices, with the Zendo device attached to each and
    whether it's online. This is an internal service called by the Zendo app
    and should not be called manually.

replace_managed_device:
  name: Replace managed device [Internal]
  description: >-
    Attach the replacement, the Zendo device whose profile ID and device ID are
    given, to another managed device, so automations that control that managed
    device control the replacement instead. The request can come from any
    device, such as an admin's phone. The replacement's own managed device, the
    one it leaves behind, is removed. This is an internal service called by the
    Zendo app and should not be called manually.
  fields:
    profile_id:
      name: Profile ID
      description: >-
        Required. The profile ID of the replacement, the device that takes the
        managed device's place.
      required: true
      selector:
        text:
    device_id:
      name: Device ID
      description: Required. The device ID of the replacement.
      required: true
      selector:
        text:
    managed_device_id:
      name: Managed device ID
      description: Required. The managed device the replacement takes over.
      required: true
      selector:
        text:

delete_managed_device:
  name: Delete managed device [Internal]
  description: >-
    Remove an offline managed device and its entities. A managed device that's
    online can't be removed. This is an internal service called by the Zendo
    app and should not be called manually.
  fields:
    managed_device_id:
      name: Managed device ID
      description: Required. The managed device to remove.
      required: true
      selector:
        text:

# ---------------------------------------------------------------------------
# Managed devices -- automation-facing (called by HA automations)
# ---------------------------------------------------------------------------

managed_device_screensaver_configure:
  name: Configure device screensaver (Kiosk)
  description: >-
    Configure the screensaver on a Zendo device. All settings are
    optional - only the values you provide will be changed, the rest remain
    unchanged.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true
    mode:
      name: Mode
      description: >-
        Optional. The screensaver mode. "none" disables the screensaver, "dim"
        reduces brightness but keeps content visible, "black" turns the screen
        fully dark, "clock" shows a clock on a dark background.
      required: false
      selector:
        select:
          options:
            - label: "None (disabled)"
              value: "none"
            - label: "Dim"
              value: "dim"
            - label: "Black"
              value: "black"
            - label: "Clock"
              value: "clock"
    timer:
      name: Timer
      description: >-
        Optional. Minutes of inactivity before the screensaver activates
        (1-60).
      required: false
      selector:
        number:
          min: 1
          max: 60
          mode: slider
          unit_of_measurement: "min"

managed_device_screen_configure:
  name: Configure device screen (Kiosk)
  description: >-
    Configure screen settings on a Zendo device. All settings are
    optional - only the values you provide will be changed, the rest remain
    unchanged.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true
    brightness:
      name: Brightness
      description: >-
        Optional. Screen brightness (1-100%). With auto-brightness on, this is
        how bright the screen is in normal room light, and the device adjusts
        it as the light changes.
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: slider
          unit_of_measurement: "%"
    color_scheme:
      name: Color scheme
      description: >-
        Optional. The app color scheme.
      required: false
      selector:
        select:
          options:
            - label: "Dark"
              value: "dark"
            - label: "Light"
              value: "light"

managed_device_screen_wake_up:
  name: Wake up device screen (Kiosk)
  description: >-
    Wake the screen on a Zendo device. The screen stays on until the
    screensaver timer expires.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true

managed_device_audio_configure:
  name: Configure device audio (Kiosk)
  description: >-
    Configure audio settings on a Zendo device. All settings are
    optional - only the values you provide will be changed, the rest remain
    unchanged.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true
    volume:
      name: Volume
      description: Optional. Device volume (0-100%).
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"

managed_device_app_reload:
  name: Reload device app (Kiosk)
  description: >-
    Reload the Zendo app on a device.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true

managed_device_app_lock:
  name: Lock device (Kiosk)
  description: >-
    Lock a Zendo device with a PIN. Device will require the PIN to
    unlock locally. Device can also be unlocked remotely using the
    managed_device_app_unlock service.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true
    pin:
      name: PIN
      description: >-
        Required. A numeric PIN that must be entered to unlock the device.
        Must be exactly 4, 6, or 8 digits.
      required: true
      selector:
        text:
    message:
      name: Lock message
      description: >-
        Optional. A message to display on the lock screen.
      required: false
      selector:
        text:

managed_device_app_unlock:
  name: Unlock device (Kiosk)
  description: >-
    Remotely unlock a Zendo device. No PIN is needed for remote
    unlock.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true

managed_device_auto_brightness_configure:
  name: Configure device auto-brightness (Kiosk)
  description: >-
    Turn auto-brightness on or off on a Zendo device. With it on, the device
    adjusts the screen to the light around it, and the brightness you set is
    how bright the screen is in normal room light. Devices without a working
    light sensor are skipped.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true
    mode:
      name: Mode
      description: Required. Turn auto-brightness on or off.
      required: true
      selector:
        select:
          options:
            - label: "On"
              value: "on"
            - label: "Off"
              value: "off"

managed_device_wake_on_approach_configure:
  name: Configure device wake on approach (Kiosk)
  description: >-
    Configure wake on approach on a Zendo device: the screen wakes when someone
    comes up to it. Provide at least one setting - only the values you provide
    will be changed, the rest remain unchanged. Devices that can't wake on
    approach are skipped.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true
    mode:
      name: Mode
      description: Optional. Turn wake on approach on or off.
      required: false
      selector:
        select:
          options:
            - label: "On"
              value: "on"
            - label: "Off"
              value: "off"
    sensitivity:
      name: Sensitivity
      description: >-
        Optional. How close someone has to come for the screen to wake. Only
        devices whose sensor tells distance have sensitivity levels. On the
        others it's left out, and the mode is still set.
      required: false
      selector:
        select:
          options:
            - label: "Very close"
              value: "very_close"
            - label: "Close"
              value: "close"
            - label: "Medium"
              value: "medium"
            - label: "Far"
              value: "far"

managed_device_admin_code_configure:
  name: Configure device admin code (Kiosk)
  description: >-
    Set or remove the admin code on Zendo devices with Always-On Display
    (Kiosk) on. The devices have to be online. Only Home Assistant
    administrators can run this action, and a code set here shows in
    recorded events and traces.
  fields:
    device:
      name: Device
      description: Required. One or more Zendo devices.
      required: true
      selector:
        device:
          integration: zendo
          multiple: true
    code:
      name: Code
      description: >-
        The admin code to set: exactly 4, 6 or 8 digits. In YAML, put it in
        quotes. Give either a code or Remove.
      required: false
      selector:
        text:
          type: password
    remove:
      name: Remove
      description: >-
        Remove the admin code. Give either a code or Remove.
      required: false
      selector:
        boolean:

managed_device_admin_code_get:
  name: Get device admin code (Kiosk)
  description: >-
    Get the admin code of a Zendo device with Always-On Display (Kiosk) on,
    even while it's offline. Responds with admin_code, status (set, not_set
    or unknown) and reported_at. Only Home Assistant administrators can run
    this action.
  fields:
    device:
      name: Device
      description: Required. One Zendo device.
      required: true
      selector:
        device:
          integration: zendo
